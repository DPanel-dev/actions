name: Mirror Appstore Repositories

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: read

concurrency:
  group: mirror-appstore-repositories
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror ${{ matrix.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: qyg2297248353/appstore-dpanel
            tag: qyg2297248353
          - repository: 1Panel-dev/appstore
            tag: 1panel
          - repository: okxlin/appstore
            tag: okxlin
    defaults:
      run:
        shell: bash
    env:
      SOURCE_URL: https://github.com/${{ matrix.repository }}
      DOCKER_IMAGE: docker.io/dpanel/store
      ALIYUN_IMAGE: registry.cn-hangzhou.aliyuncs.com/dpanel/store
      IMAGE_TAG: ${{ matrix.tag }}

    steps:
      - name: Read upstream revision
        id: source
        run: |
          set -euo pipefail
          revision=$(git ls-remote --exit-code "$SOURCE_URL.git" HEAD | awk '$2 == "HEAD" { print $1 }')
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compare published revision
        if: github.event_name == 'schedule'
        id: compare
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          if skopeo inspect --config --retry-times 3 \
            --authfile "${DOCKER_CONFIG:-$HOME/.docker}/config.json" \
            "docker://$DOCKER_IMAGE:$IMAGE_TAG" > "$RUNNER_TEMP/image-config.json"; then
            revision=$(jq -r '.config.Labels["com.dpanel.revision"] // ""' "$RUNNER_TEMP/image-config.json")
            source=$(jq -r '.config.Labels["com.dpanel.plugin.source"] // ""' "$RUNNER_TEMP/image-config.json")
            root=$(jq -r '.config.Labels["com.dpanel.plugin.root"] // ""' "$RUNNER_TEMP/image-config.json")
            if [[ "$revision" == "$SOURCE_REVISION" && "$source" == "$SOURCE_URL" && "$root" == / ]]; then
              echo 'build=false' >> "$GITHUB_OUTPUT"
              echo "$SOURCE_URL: unchanged ($SOURCE_REVISION), build skipped; Aliyun sync will still run." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            echo '::warning::Cannot read the published image revision. Attempting a build and push; see the registry error above.'
          fi
          echo 'build=true' >> "$GITHUB_OUTPUT"

      - name: Package repository files
        if: github.event_name == 'workflow_dispatch' || steps.compare.outputs.build == 'true'
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repository-image"
          git init "$RUNNER_TEMP/source"
          cd "$RUNNER_TEMP/source"
          git remote add origin "$SOURCE_URL.git"
          git -c protocol.version=2 fetch --depth=1 origin "$SOURCE_REVISION"
          git -c core.autocrlf=false checkout --detach FETCH_HEAD
          [[ "$(git rev-parse HEAD)" == "$SOURCE_REVISION" ]]
          # Archive the checkout's tracked files so export-ignore/export-subst cannot change the snapshot.
          git ls-files -z | tar --create --file="$RUNNER_TEMP/repository-image/repository.tar" \
            --format=gnu --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git show -s --format=%ct HEAD)" \
            --null --verbatim-files-from --no-recursion --files-from=-
          printf 'FROM scratch\nADD repository.tar /\n' > "$RUNNER_TEMP/repository-image/Dockerfile"

      - name: Build and push to Docker Hub
        if: github.event_name == 'workflow_dispatch' || steps.compare.outputs.build == 'true'
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          docker build --no-cache --provenance=false --platform linux/amd64 \
            --label "com.dpanel.revision=$SOURCE_REVISION" \
            --label "com.dpanel.plugin.source=$SOURCE_URL" \
            --label com.dpanel.plugin.root=/ \
            --tag "$DOCKER_IMAGE:$IMAGE_TAG" \
            "$RUNNER_TEMP/repository-image"
          docker push "$DOCKER_IMAGE:$IMAGE_TAG"
          echo "$SOURCE_URL: published $DOCKER_IMAGE:$IMAGE_TAG ($SOURCE_REVISION)." >> "$GITHUB_STEP_SUMMARY"

      - name: Login to Aliyun
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Sync images to Aliyun with Skopeo
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          # Retry registry synchronization even when Docker Hub already has this revision.
          skopeo copy --all --preserve-digests --retry-times 3 \
            --authfile "${DOCKER_CONFIG:-$HOME/.docker}/config.json" \
            "docker://$DOCKER_IMAGE:$IMAGE_TAG" \
            "docker://$ALIYUN_IMAGE:$IMAGE_TAG"
          echo "$SOURCE_URL: synced $ALIYUN_IMAGE:$IMAGE_TAG ($SOURCE_REVISION)." >> "$GITHUB_STEP_SUMMARY"
