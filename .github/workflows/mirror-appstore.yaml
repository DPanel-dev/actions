name: Mirror Appstore Repositories

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: read

concurrency:
  group: mirror-appstore-repositories
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror ${{ matrix.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: qyg2297248353/appstore-dpanel
            tag: qyg2297248353
          - repository: 1Panel-dev/appstore
            tag: 1panel
          - repository: okxlin/appstore
            tag: okxlin
    defaults:
      run:
        shell: bash
    env:
      SOURCE_URL: https://github.com/${{ matrix.repository }}
      DOCKER_IMAGE: docker.io/dpanel/store
      ALIYUN_IMAGE: registry.cn-hangzhou.aliyuncs.com/dpanel/store
      IMAGE_TAG: ${{ matrix.tag }}

    steps:
      - name: Read upstream revision
        id: source
        run: |
          set -euo pipefail
          revision=$(git ls-remote --exit-code "$SOURCE_URL.git" HEAD | awk '$2 == "HEAD" { print $1 }')
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compare published revision
        id: compare
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          echo "### $SOURCE_URL" >> "$GITHUB_STEP_SUMMARY"
          if skopeo inspect --config --retry-times 3 \
            --authfile "${DOCKER_CONFIG:-$HOME/.docker}/config.json" \
            "docker://$DOCKER_IMAGE:$IMAGE_TAG" > "$RUNNER_TEMP/image-config.json"; then
            release=$(jq -r '.config.Labels["com.dpanel.release"] // ""' "$RUNNER_TEMP/image-config.json")
            revision=$(jq -r '.config.Labels["com.dpanel.store.commit"] // ""' "$RUNNER_TEMP/image-config.json")
            source=$(jq -r '.config.Labels["com.dpanel.store.source"] // ""' "$RUNNER_TEMP/image-config.json")
            root=$(jq -r '.config.Labels["com.dpanel.store.root"] // ""' "$RUNNER_TEMP/image-config.json")
            if [[ "$revision" =~ ^[0-9a-f]{40}$ && "$source" == "$SOURCE_URL" && "$root" == / ]]; then
              echo "previous_revision=$revision" >> "$GITHUB_OUTPUT"
              if [[ "$release" == "$SOURCE_REVISION" && "$revision" == "$SOURCE_REVISION" ]]; then
                echo 'build=false' >> "$GITHUB_OUTPUT"
                echo '已发布版本与上游一致；定时运行跳过构建，手动运行仍强制构建。阿里云补同步继续执行。' >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo '版本或元数据需要更新，将重新构建。' >> "$GITHUB_STEP_SUMMARY"
            else
              echo '已发布镜像缺少有效的新元数据或来源、目录不匹配，将重新构建；无法确定应用变化基线。' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo '::warning::Cannot read the published image revision. Attempting a build and push; see the registry error above.'
            echo '无法读取已发布镜像（可能尚未发布或读取失败），将尝试构建；无法确定应用变化基线。' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'build=true' >> "$GITHUB_OUTPUT"

      - name: Fetch repository snapshot
        if: github.event_name == 'workflow_dispatch' || steps.compare.outputs.build == 'true'
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/source"
          cd "$RUNNER_TEMP/source"
          git remote add origin "$SOURCE_URL.git"
          git -c protocol.version=2 fetch --depth=1 origin "$SOURCE_REVISION"
          git -c core.autocrlf=false checkout --detach FETCH_HEAD
          [[ "$(git rev-parse HEAD)" == "$SOURCE_REVISION" ]]

      - name: Summarize application changes
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.compare.outcome == 'success' }}
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
          PREVIOUS_REVISION: ${{ steps.compare.outputs.previous_revision }}
        run: |
          set -euo pipefail
          printf '### %s：有变化的应用\n\n' "$SOURCE_URL" >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "$PREVIOUS_REVISION" ]]; then
            echo '无法比较：没有可用的上次发布记录。' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == schedule && "$PREVIOUS_REVISION" == "$SOURCE_REVISION" ]]; then
            echo '无应用变化。' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$PREVIOUS_REVISION" != "$SOURCE_REVISION" ]] && \
            ! git -C "$RUNNER_TEMP/source" fetch --depth=1 origin "$PREVIOUS_REVISION"; then
            echo '无法比较：上次发布的源码快照无法获取。' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if app_list=$(git -C "$RUNNER_TEMP/source" diff --no-renames --name-only -z \
            "$PREVIOUS_REVISION" "$SOURCE_REVISION" -- apps/ | jq -Rrs '
              split("\u0000")
              | map(split("/") | select(length > 2 and .[0] == "apps") | .[1])
              | unique
              | if length == 0 then "无应用变化。" else .[] | "- <code>\(@html)</code>" end
            '); then
            printf '%s\n' "$app_list" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '无法比较：源码快照差异读取失败，请查看本步骤日志。' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Package repository files
        if: github.event_name == 'workflow_dispatch' || steps.compare.outputs.build == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repository-image"
          cd "$RUNNER_TEMP/source"
          # Archive the checkout's tracked files so export-ignore/export-subst cannot change the snapshot.
          git ls-files -z | tar --create --file="$RUNNER_TEMP/repository-image/repository.tar" \
            --format=gnu --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git show -s --format=%ct HEAD)" \
            --null --verbatim-files-from --no-recursion --files-from=-
          printf 'FROM scratch\nADD repository.tar /\n' > "$RUNNER_TEMP/repository-image/Dockerfile"

      - name: Set up Docker Buildx
        if: github.event_name == 'workflow_dispatch' || steps.compare.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push to Docker Hub
        if: github.event_name == 'workflow_dispatch' || steps.compare.outputs.build == 'true'
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
          IMAGE_VERSION: rolling
        run: |
          set -euo pipefail
          image_created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker buildx build --no-cache --provenance=false --platform linux/amd64 \
            --output type=image,oci-mediatypes=true,push=true \
            --annotation "manifest:com.dpanel.version=$IMAGE_VERSION" \
            --annotation "manifest:com.dpanel.release=$SOURCE_REVISION" \
            --label "com.dpanel.version=$IMAGE_VERSION" \
            --label "com.dpanel.release=$SOURCE_REVISION" \
            --label "com.dpanel.image.createdAt=$image_created_at" \
            --label "com.dpanel.store.source=$SOURCE_URL" \
            --label "com.dpanel.store.commit=$SOURCE_REVISION" \
            --label com.dpanel.store.root=/ \
            --tag "$DOCKER_IMAGE:$IMAGE_TAG" \
            "$RUNNER_TEMP/repository-image"
          echo "$SOURCE_URL: published $DOCKER_IMAGE:$IMAGE_TAG ($SOURCE_REVISION)." >> "$GITHUB_STEP_SUMMARY"

      - name: Login to Aliyun
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Sync images to Aliyun with Skopeo
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          # Retry registry synchronization even when Docker Hub already has this revision.
          skopeo copy --all --preserve-digests --retry-times 3 \
            --authfile "${DOCKER_CONFIG:-$HOME/.docker}/config.json" \
            "docker://$DOCKER_IMAGE:$IMAGE_TAG" \
            "docker://$ALIYUN_IMAGE:$IMAGE_TAG"
          echo "$SOURCE_URL: synced $ALIYUN_IMAGE:$IMAGE_TAG ($SOURCE_REVISION)." >> "$GITHUB_STEP_SUMMARY"
